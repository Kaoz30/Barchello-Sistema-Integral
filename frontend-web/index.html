<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- FAVICON BARCHELLO — SET PROFESIONAL (RFG)  -->
    <!-- 1. Precarga con prioridad alta del icono de pestaña -->
    <link rel="preload" as="image" href="img/favicon/favicon-96x96.png">
    <!-- 2. Icono principal PNG (Chrome, Firefox, Edge modernos) -->
    <link rel="icon" type="image/png" sizes="96x96" href="img/favicon/favicon-96x96.png">
    <!-- 3. iOS / iPadOS al guardar en pantalla de inicio -->
    <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
    <!-- 4. Manifest PWA (Android Chrome / instalación como app) -->
    <link rel="manifest" href="img/favicon/site.webmanifest">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barchello Bávaro Pub - Iniciar Sesión</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- CSS externo compartido -->
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Fondo degradado (heredado del diseño de mi login anterior con materialize) */
        body {
            background: linear-gradient(135deg, #3E2723 0%, #2c1a16 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        /* Tarjeta del login */
        .card-login {
            background-color: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            padding: 30px 25px 40px 25px;
            width: 100%;
            max-width: 450px;
            border: none;
        }
        @media (min-width: 768px) { .card-login { max-width: 500px; } }
        @media (min-width: 1200px) { .card-login { max-width: 550px; } }

        /* Logo */
        .logo-container img {
            max-width: 135px;
            height: auto;
        }

        /* Título */
        .card-login h2 {
            font-family: 'Playfair Display', serif;
            color: #3E2723;
            text-align: center;
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 25px;
            margin-top: -15px;         /* ← esta línea sube el título */
        }

        /* ========== ESTILOS "MATERIALIZE-LIKE" ========== */
        /* Cada campo: contenedor relativo para posicionar el icono */
        .input-field {
            position: relative;
            margin-bottom: 38px; /* Espacio FIJO reservado para el mensaje de error */
  
        }

        /* Icono a la izquierda */
        .input-field .prefix {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: #8D6E63;
            font-size: 1.1rem;
            transition: color 0.3s;
            z-index: 2;
        }

        /* El input en sí */
        .input-field input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #8D6E63;
            border-radius: 6px;
            padding: 10px 0px 10px 35px;  /* <-- ajustar el texto escrito dentro del input */
            line-height: 20px;
            background-color: rgba(239, 235, 233, 0.20);  /* fondo arena tenue */
            font-size: 1rem;
            font-weight: 400;
            color: #3E2723;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-field input:focus {
            border-bottom: 1.5px solid #00897B;        /* color teal */
            box-shadow: 0 1px 0 0 #00897B;           /* sombra sutil teal */
        }

        /* Label flotante (usamos form-floating de Bootstrap pero adaptado) */
        .input-field label {
            position: absolute;
            left: 35px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.85rem;
            font-weight: 380;
            color: #8D6E63;
            transition: all 0.3s ease;
            pointer-events: none;
            background-color: transparent;
            padding: 0;
        }

        /* Cuando el input tiene foco o valor, el label se mueve arriba */
        .input-field input:focus ~ label,
        .input-field input:not(:placeholder-shown) ~ label {
            top: -14.5px;
            left: 35px;
            font-size: 0.7rem;
            font-weight: 395;
            color: #00897B;
            transform: translateY(0);
        }
        /* Si el campo tiene foco (contenedor), el label se vuelve teal */
        .input-field:focus-within label {
            color: #00897B;
        }
        /* Label cuando el campo tiene valor pero no tiene foco */
        .input-field input:not(:focus):not(:placeholder-shown) ~ label {
            color: rgba(141, 110, 99, 0.60);   /* marrón roble con opacidad ajustable */
            font-weight: 400;
        }

        /* Si el campo tiene error, borde rojo */
        .input-field input.error {
            border-bottom-color: #D32F2F;
        }

        /* Focus en estado de error: rojo suave con glow */
        .input-field input.error:focus {
            border-bottom: 1.5px solid #D32F2F;
            box-shadow: 0 1px 0 0 rgba(211, 47, 47, 0.4);
        }

        /* Mensaje de error: invisible por defecto, animado al aparecer */
        .error-msg {
            position: absolute;
            top: 103%;
            left: 0;
            right: 0;
            margin-top: 4px;
            color: #b71c1c;
            font-weight: 400;
            font-size: 0.70rem;
            display: flex;
            align-items: center;
            gap: 4px;
            padding-left: 35px;
            white-space: nowrap;
            opacity: 0;
            transform: translateY(-5px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }

        /* Error visible: aparece con animación suave */
        .error-msg.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
                
        /* Ojito mostrar/ocultar contraseña */
        .toggle-password {
            position: absolute;
            right: 0;
            top: 55%;
            transform: translateY(-50%);  /* centrado vertical */
            cursor: pointer;
            color: #8D6E63;
            font-size: 1.05rem;
            z-index: 2;
            padding: 4px;
            transition: transform 0.2s, color 0.2s;  /* añade suavidad */
        }
        .toggle-password:hover {
            color: #3E2723;
            transform: translateY(-50%) scale(1.07);  /* combinación de centrado + escalado */
        }

        /* Botón Ingresar */
        .btn-ingresar {
            background-color: #8D6E63;
            border: none;
            width: 100%;
            border-radius: 48px;
            font-weight: bold;
            font-size: 1rem;
            padding: 10px;
            color: #fff;
            margin-top: 10px;

            /* sombra que simula elevación (efecto 3D) */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.25), 0 1px 3px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }
        .btn-ingresar:hover {
            background-color: #6d4c41;
            transform: scale(1.03);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3), 0 2px 4px rgba(0, 0, 0, 0.2);
            color: #fff;
        }
        .btn-ingresar:active {
            transform: translateY(1px);  /* se hunde al hacer clic */
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.2); /* sombra más pequeña */
        }

        /* Enlace de recuperación */
        .forgot-link a {
            display: inline-block;
            margin-top: 8px;         /* ajusta distancia del enlace */
            color: #8D6E63;
            font-weight: 400;
            text-decoration: underline;
            font-size: 0.85rem;       /* ajustar tamaño del enlace*/
        }
        .forgot-link a:hover {
            color: #3E2723;
            transform: scale(1.06);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .card-login { padding: 20px 18px 30px; }
            .card-login h2 { font-size: 1.5rem; }
        }
        @media (max-width: 900px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 20px;
                overflow-y: auto;
            }
            .card-login { margin-bottom: 30px; }
        }
    </style>
</head>
<body>
    <div class="card card-login">
        <div class="card-body p-4 p-md-5">
            <!-- Logo -->
            <div class="logo-container text-center mb-3">
                <img src="img\logos\logo-barchello-hd2.png" alt="Barchello Bávaro Pub" class="img-fluid">
            </div>
            <h2 class="text-center">Bienvenido a BaBah</h2>

            <!-- Formulario se agregó novalidate para evitar validación nativa -->
            <form id="loginForm" novalidate>

                <!-- Campo Usuario -->
                <div class="input-field">
                    <i class="bi bi-person-fill prefix"></i>
                    <input type="text" id="username" name="username" placeholder=" " autocomplete="off">
                    <label for="username">Nombre de usuario</label>

                    <div class="error-msg">
                        <span></span>
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div class="input-field">
                    <i class="bi bi-lock-fill prefix"></i>
                    <input type="password" id="password" name="password" placeholder=" ">
                    <i class="bi bi-eye-slash toggle-password" id="togglePassword"></i>
                    <label for="password">Contraseña</label>

                    <div class="error-msg">
                        <span></span>
                    </div>
                </div>

                <!-- Botón Ingresar -->
                <button type="submit" id="btnIngresar" class="btn btn-ingresar">
                    Ingresar <i class="bi bi-send ms-2"></i>
                </button>

                <!-- Enlace recuperar contraseña -->
                <div class="forgot-link text-center mt-3">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
            </form>
        </div>
    </div>

    <!-- ARQUITECTURA GLOBAL DE SCRIPTS (ÚNICO BLOQUE) -->
    <!-- ORDEN OPTIMIZADO (auth primero, validaciones al final) -->
    <!-- 1. Bootstrap JS (necesario para dropdowns y modals) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. Auth INMEDIATO (se auto-ejecuta, no espera nada) -->
    <script src="js/auth.js"></script>

    <!-- 3. UI (toasts, helpers - usado por auth) -->
    <script src="js/ui.js"></script>

    <!-- 4. API (capa de datos) -->
    <script src="js/api.js"></script>

    <!-- 5. jQuery + Validate (solo necesarios en páginas con formularios) -->
    <script src="js/lib/jquery-3.7.1.min.js"></script>
    <script src="js/lib/jquery.validate.min.js"></script>

    <!-- 6. Validaciones (depende de jQuery) -->
    <script src="js/validaciones.js"></script>

    <!-- 7. App.js AL FINAL (inicializa módulos específicos) -->
    <script src="js/app.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const forgotLink = document.querySelector('.forgot-link a');
        if (forgotLink) {
            forgotLink.addEventListener('click', (e) => {
                e.preventDefault(); // Evita el salto al #
                
                // Usamos mi arquitectura UI para mostrar un Toast profesional
                if (typeof UI !== 'undefined' && typeof UI.mostrarToast === 'function') {
                    UI.mostrarToast('🔒 La recuperación de contraseña se habilitará al conectar con el Backend. Contacta al administrador.', 'warning');
                } else {
                    alert('Función en preparación para la fase de Backend.');
                }
            });
        }
    });
</script>
</body>
</html>
