<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <!-- FAVICON BARCHELLO — SET PROFESIONAL (RFG)  -->
    <!-- 1. Precarga con prioridad alta del icono de pestaña -->
    <link rel="preload" as="image" href="img/favicon/favicon-96x96.png">
    <!-- 2. Icono principal PNG (Chrome, Firefox, Edge modernos) -->
    <link rel="icon" type="image/png" sizes="96x96" href="img/favicon/favicon-96x96.png">
    <!-- 3. iOS / iPadOS al guardar en pantalla de inicio -->
    <link rel="apple-touch-icon" sizes="180x180" href="img/favicon/apple-touch-icon.png">
    <!-- 4. Manifest PWA (Android Chrome / instalación como app) -->
    <link rel="manifest" href="img/favicon/site.webmanifest">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barchello Bávaro Pub - Registro de Cliente (Programa de Puntos)</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- CSS externo compartido -->
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: linear-gradient(145deg, var(--color-cuero), #1f1310);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            font-family: var(--font-cuerpo);
        }
        .card-registro {
            background: var(--color-arena);
            border-radius: 28px;
            padding: 30px 30px 45px;
            max-width: 850px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border: none;
        }
        .card-registro h2 {
            font-family: var(--font-titulos);
            color: var(--color-cuero);
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-small {
            max-width: 90px;
            display: block;
            margin: 0 auto 15px;
        }
        .form-control, .form-select {
            background-color: rgba(239, 235, 233, 0.25);
            border-color: var(--color-roble);
            color: var(--color-cuero);
            font-weight: 500;
        }
        .form-control:focus, .form-select:focus {
            border-color: #C67C2E;
            box-shadow: 0 1px 0 0 #C67C2E;
            background-color: rgba(239, 235, 233, 0.25);
        }
        .input-group-text {
            background-color: transparent;
            color: var(--color-roble);
            border-right: none;
        }
        .input-group .form-control {
            border-left: none;
        }
        /* Ajuste para que los mensajes de error de jQuery Validate se vean bien */
        .error-msg {
            color: #b71c1c;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            padding-left: 5px;
        }
        .btn-registrar {
            background-color: var(--color-roble);
            border: none;
            width: 100%;
            border-radius: 48px;
            margin-top: 25px;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 12px;
            color: #fff;
            transition: all 0.2s;
        }
        .btn-registrar:hover {
            background-color: #5d4037;
            color: #fff;
            transform: scale(1.02);
        }
        @media (max-width: 600px) {
            .card-registro { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="card card-registro">
        <img src="img\logos\logo-barchello-hd2.png" alt="Logo Barchello Bávaro Pub" class="logo-small">
        <h2>Club de Puntos Barchello</h2>
        <p class="text-center text-muted mb-4">Regístrate y acumula puntos con cada consumo</p>
        
        <!-- NOTA: Se agregaron los atributos name="" obligatorios para jQuery Validate -->
        <form id="registroForm">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" class="form-control" id="nombres" name="nombres" placeholder="Nombres">
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                        <input type="text" class="form-control" id="apellidos" name="apellidos" placeholder="Apellidos">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-credit-card-fill"></i></span>
                        <input type="text" class="form-control" id="cedula" name="cedula" inputmode="numeric" placeholder="Cédula (solo números)">
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-cake2-fill"></i></span>
                        <input type="date" class="form-control" id="fechanac" name="fechanac">
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-registrar">
                Registrar Cliente <i class="bi bi-check-circle-fill ms-2"></i>
            </button>
        </form>
    </div>

    <!-- ARQUITECTURA GLOBAL DE SCRIPTS (ÚNICO BLOQUE) -->
    <!-- ORDEN OPTIMIZADO (auth primero, validaciones al final) -->
    <!-- 1. Bootstrap JS (necesario para dropdowns y modals) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- 2. Auth INMEDIATO (se auto-ejecuta, no espera nada) -->
    <script src="js/auth.js"></script>

    <!-- 3. UI (toasts, helpers - usado por auth) -->
    <script src="js/ui.js"></script>

    <!-- 4. API (capa de datos) -->
    <script src="js/api.js"></script>

    <!-- 5. jQuery + Validate (solo necesarios en páginas con formularios) -->
    <script src="js/lib/jquery-3.7.1.min.js"></script>
    <script src="js/lib/jquery.validate.min.js"></script>

    <!-- 6. Validaciones (depende de jQuery) -->
    <script src="js/validaciones.js"></script>

    <!-- 7. App.js AL FINAL (inicializa módulos específicos) -->
    <script src="js/app.js"></script>

    <!-- Script específico para instanciar la validación en esta vista pública -->
    <script>
        $(document).ready(function() {
            // 1. Regla personalizada para que la fecha no sea futura
            $.validator.addMethod("noFuturo", function(value, element) {
                return this.optional(element) || new Date(value) <= new Date();
            }, "La fecha no puede ser futura");

            // 2. Inicializar jQuery Validate
            $("#registroForm").validate({
                rules: {
                    nombres: { required: true, minlength: 3 },
                    apellidos: { required: true, minlength: 3 },
                    cedula: { required: true, digits: true, minlength: 7, maxlength: 10 },
                    fechanac: { required: true, date: true, noFuturo: true }
                },
                messages: {
                    nombres: "Ingrese sus nombres (mínimo 3 letras)",
                    apellidos: "Ingrese sus apellidos (mínimo 3 letras)",
                    cedula: {
                        required: "La cédula es obligatoria",
                        digits: "Solo se permiten números",
                        minlength: "Mínimo 7 dígitos",
                        maxlength: "Máximo 10 dígitos"
                    },
                    fechanac: {
                        required: "Seleccione su fecha de nacimiento",
                        noFuturo: "La fecha no puede ser futura"
                    }
                },
                errorElement: 'div',
                errorClass: 'error-msg',
                errorPlacement: function(error, element) {
                    // Inserta el error justo debajo del input-group
                    error.insertAfter(element.closest('.input-group'));
                },
                submitHandler: function(form) {
                    // Simular guardado en API (Backend futuro)
                    const nuevoCliente = {
                        nombres: $("#nombres").val(),
                        apellidos: $("#apellidos").val(),
                        cedula: $("#cedula").val(),
                        fechanac: $("#fechanac").val(),
                        puntos: 0
                    };
                    
                    // Aquí en el futuro llamarías a: api.guardarCliente(nuevoCliente);
                    console.log("Cliente enviado a la API:", nuevoCliente);
                    
                    // Feedback visual usando tu arquitectura (ui.js)
                    if(typeof mostrarToast === 'function') {
                        mostrarToast('✔️ Cliente registrado en el programa de puntos', 'success');
                    }
                    form.reset();
                }
            });
        });
    </script>
</body>
</html>
