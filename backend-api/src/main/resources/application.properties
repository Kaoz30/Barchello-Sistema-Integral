spring.application.name=barchello-api
server.port=8080

# Conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/barchello_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# IMPORTANTE:Dejar en 'update' para desarrollo. En producción se usa 'none' o 'validate'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Le decimos que respete los nombres exactos de tus columnas (ej. idCategoria en vez de id_categoria)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl